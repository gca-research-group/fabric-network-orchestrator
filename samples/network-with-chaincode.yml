output: output/network-with-chaincode
network: network-with-chaincode

capabilities:
  channel: V2_0
  orderer: V2_0
  application: V2_5

organizations:
  - name: Org1
    domain: org1.network-with-chaincode.com
    orderers:
      - name: Orderer
        subdomain: orderer
    peers:
      - name: Peer0
        subdomain: peer0
        exposePort: 7051

  - name: Org2
    domain: org2.network-with-chaincode.com
    peers:
      - name: Peer0
        subdomain: peer0
        exposePort: 8051

  - name: Org3
    domain: org3.network-with-chaincode.com
    peers:
      - name: Peer0
        subdomain: peer0
        exposePort: 9051

profiles:
  - name: DefaultProfile
    organizations:
      - Org1
      - Org2
      - Org3

channels:
  - name: defaultchannel
    profile: DefaultProfile
    chaincodes:
      - name: Asset
        version: "1.0"
        path: samples/chaincodes/go/asset-go
        language:
          name: golang

      - name: Product
        version: "1.0"
        path: samples/chaincodes/go/product

      - name: PrivateAgreement
        version: "1.0"
        path: samples/chaincodes/go/private-agreement
        channelConfigPolicy: Channel/Application/Endorsement
        collectionsConfig: samples/chaincodes/go/private-agreement/collections_config.json
